[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-3d-self"
version = "0.1.0"
description = "Automated 3D Avatar pipeline from COLMAP scanning to MetaHuman & Unreal Engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "open3d",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
