[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-3d-self"
version = "0.1.0"
description = "Tooling for a realistic 3D self-avatar pipeline from reconstruction to Unreal Engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
geometry = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "trimesh>=4,<5",
    "open3d>=0.18,<1",
]
vision = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "opencv-python>=4.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
