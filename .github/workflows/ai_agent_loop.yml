name: AI Agent Task Loop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-agent-task-loop
  cancel-in-progress: true

jobs:
  ai_tasks:
    if: ${{ secrets.CLAUDE_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Explain current state
        run: |
          echo "The AI agent workflow is intentionally manual-only."
          echo "Automatic repository mutation is disabled until the agent implementation is complete."
