name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/validate_and_export.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/validate_and_export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --quiet -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check critical Python errors
        run: ruff check scripts tests

      - name: Run unit tests
        run: pytest -q
