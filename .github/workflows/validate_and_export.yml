name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Check critical Python errors
        run: |
          python -m pip install --disable-pip-version-check --quiet ruff
          ruff check scripts --select E9,F63,F7,F82
