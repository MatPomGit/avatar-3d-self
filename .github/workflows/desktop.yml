name: Desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AvatarStudio-Windows
          - os: ubuntu-latest
            artifact: AvatarStudio-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -e ".[desktop,desktop-build]"
      - name: Run non-GUI tests
        run: python -m pytest -q tests/test_avatar_studio.py
      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AvatarStudio apps/avatar_studio/launcher.py
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/AvatarStudio*
          if-no-files-found: error
