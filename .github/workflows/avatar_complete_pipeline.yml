name: Complete Avatar Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-avatar-pipeline
  cancel-in-progress: false

jobs:
  pbr_textures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pillow numpy scipy
      - name: Generate PBR textures
        run: |
          python scripts/pbr_texture_processor.py \
            --diffuse references/photos/scan_output_texture.png \
            --output assets/textures/pbr
      - name: Convert materials to multi-engine
        run: python scripts/material_converter.py

  lipsync_generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Piper TTS
        run: python -m pip install piper-tts
      - name: Generate lip sync animations
        run: |
          python scripts/piper_lipsync_generator.py \
            --text "Hello! I'm your realistic 3D avatar." \
            --output exports/speech

  web_viewer_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web/viewer
        run: npm install --no-audit --no-fund
      - name: Build THREE.js viewer
        working-directory: web/viewer
        run: npm run build

  quality_validation:
    runs-on: ubuntu-latest
    needs: [pbr_textures, lipsync_generation, web_viewer_build]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Report repository export state
        run: |
          python - <<'PY'
          from pathlib import Path

          exports = Path("exports")
          checks = {
              "FBX model": (exports / "avatar_final.fbx").is_file() and (exports / "avatar_final.fbx").stat().st_size > 0,
              "Materials directory": (exports / "materials").is_dir(),
              "Lip sync file": (exports / "speech" / "lipsync.json").is_file(),
          }
          for label, ok in checks.items():
              print(f"[{'OK' if ok else 'INFO'}] {label}")
          PY

  create_release:
    runs-on: ubuntu-latest
    needs: quality_validation
    if: success()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: avatar-v${{ github.run_number }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            exports/avatar_final.fbx
            exports/materials/*.json
            exports/speech/**
